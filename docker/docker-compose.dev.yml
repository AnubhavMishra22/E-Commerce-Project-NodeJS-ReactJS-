version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASS:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    container_name: ecommerce-backend-dev
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret}
      NODE_ENV: development
    ports:
      - "5000:5000"
      - "9229:9229"  # Node.js debugging port
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-network-dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/products', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React Development Server with hot reload)
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: ecommerce-frontend-dev
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: 0
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ecommerce-network-dev
    stdin_open: true
    tty: true

networks:
  ecommerce-network-dev:
    driver: bridge

volumes:
  mysql_data_dev:
    driver: local
