name: Docker Build & Push

on:
  push:
    branches: [ main, develop, "claude/**" ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: quantumcart-backend
  FRONTEND_IMAGE_NAME: quantumcart-frontend

jobs:
  docker-build-test:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: docker/backend/Dockerfile
            context: .
          - service: frontend
            dockerfile: docker/frontend/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: quantumcart-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test ${{ matrix.service }} image
        run: |
          echo "✅ ${{ matrix.service }} Docker image built successfully"

  docker-compose-test:
    name: Docker Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cd docker
          cat > .env << EOF
          DB_HOST=mysql
          DB_USER=ecommerce_user
          DB_PASS=test_password
          DB_NAME=ecommerce_db
          SESSION_SECRET=test_session_secret_for_ci_cd
          NODE_ENV=production
          REACT_APP_API_URL=http://localhost:5000/api
          EOF

      - name: Verify docker-compose configuration
        run: |
          cd docker
          docker-compose config

      - name: Test docker-compose build
        run: |
          cd docker
          docker-compose build --no-cache

      - name: Clean up
        if: always()
        run: |
          cd docker
          docker-compose down -v || true

  docker-push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [docker-build-test, docker-compose-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: docker/backend/Dockerfile
          - service: frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/quantumcart-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      - name: Image digest
        run: echo "Image pushed successfully (if Docker Hub credentials configured)"
        continue-on-error: true
