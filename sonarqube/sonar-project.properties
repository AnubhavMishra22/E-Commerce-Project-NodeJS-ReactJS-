# SonarQube Project Configuration
# QuantumCart E-commerce Platform

# Project Identification
sonar.projectKey=quantumcart-ecommerce
sonar.projectName=QuantumCart E-Commerce Platform
sonar.projectVersion=1.0.0

# Source Code Directories
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# Exclusions (files not to analyze)
sonar.exclusions=**/node_modules/**, \
                 **/build/**, \
                 **/dist/**, \
                 **/coverage/**, \
                 **/*.test.js, \
                 **/*.spec.js, \
                 **/setupTests.js, \
                 **/__mocks__/**, \
                 **/public/**, \
                 **/*.config.js, \
                 **/package-lock.json, \
                 **/yarn.lock

# Test Inclusions
sonar.test.inclusions=**/*.test.js, \
                      **/*.spec.js

# Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**, \
                          **/__tests__/**, \
                          **/__mocks__/**, \
                          **/node_modules/**, \
                          **/*.test.js, \
                          **/*.spec.js

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.node.maxspace=4096

# Duplication Detection
sonar.cpd.exclusions=**/tests/**, \
                     **/__tests__/**, \
                     **/__mocks__/**

# Code Quality Rules
# Security
sonar.security.hotspots.enabled=true

# Maintainability
sonar.maintainability.rating=A

# Reliability
sonar.reliability.rating=A

# Security Rating
sonar.security.rating=A

# Technical Debt
sonar.technicalDebt.hoursInDay=8
sonar.technicalDebt.developmentCost=30
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis Properties
sonar.scm.provider=git
sonar.scm.exclusions.disabled=false

# Backend Specific Settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.exclusions=**/node_modules/**

# Frontend Specific Settings (React)
sonar.typescript.file.suffixes=.ts,.tsx

# Environment
sonar.environment.information=development

# Links
sonar.links.homepage=https://quantumcart.netlify.app
sonar.links.ci=https://github.com/AnubhavMishra22/E-Commerce-Project-NodeJS-ReactJS-
sonar.links.scm=https://github.com/AnubhavMishra22/E-Commerce-Project-NodeJS-ReactJS-
sonar.links.issue=https://github.com/AnubhavMishra22/E-Commerce-Project-NodeJS-ReactJS-/issues

# Advanced Settings
sonar.verbose=false
sonar.log.level=INFO
sonar.showProfiling=false

# Working Directory
sonar.working.directory=.sonarqube

# Scanner Configuration
sonar.scanner.metadataFilePath=.sonarqube/report-task.txt
